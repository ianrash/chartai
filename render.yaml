services:
  - type: web
    name: chartai-frontend
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-inline' https://s3.tradingview.com https://*.tradingview.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://s.tradingview.com https://*.tradingview.com; connect-src 'self' http://localhost:* https://localhost:* https://openrouter.ai https://*.supabase.co https://pofpmyiqjtwjesisytbd.supabase.co https://*.onrender.com https://chartai-wy7a.onrender.com https://*.netlify.app https://chartaanalyst.netlify.app https://generativelanguage.googleapis.com https://s3.tradingview.com https://s.tradingview.com https://*.tradingview.com wss://*.tradingview.com https://api.binance.com https://api1.binance.com https://api2.binance.com https://api3.binance.com https://api4.binance.com https://data-api.binance.vision https://*.binance.com; frame-src 'self' https://s.tradingview.com https://*.tradingview.com; worker-src 'self' blob: https://s3.tradingview.com https://*.tradingview.com; media-src 'self' blob:"
